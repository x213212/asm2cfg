<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>asm2cfg 圖形比較</title>
<style>
:root { color-scheme: light; font-family: system-ui, sans-serif; color: #292b30; background: #f5f5f2; }
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; }
header { max-width: 1600px; margin: auto; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
h1 { margin: 0; font-size: 23px; }
p { color: #61656c; font-size: 14px; line-height: 1.6; }
header p { flex: 1; min-width: 240px; }
label, button, select { font: inherit; font-size: 14px; }
button, select { border: 1px solid #c6c9ce; border-radius: 5px; padding: 6px 10px; background: white; }
button, .file-label { cursor: pointer; }
button:focus-visible, select:focus-visible, .file-label:focus-within { outline: 2px solid #285b9a; }
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; max-width: 1600px; margin: 16px auto; }
.panel { min-width: 0; border: 1px solid #d5d7db; border-radius: 8px; background: white; overflow: hidden; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid #ddd; }
h2 { font-size: 16px; margin: 0 8px 0 0; }
.file-label { position: relative; padding: 6px 10px; border: 1px solid #c6c9ce; border-radius: 5px; }
.file-label input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
select { min-width: 100px; max-width: 240px; flex: 1; }
.zoom { display: flex; align-items: center; gap: 6px; }
.zoom input { width: 90px; }
output { font: 12px monospace; width: 42px; }
.canvas { height: calc(100vh - 215px); min-height: 340px; overflow: auto; padding: 16px; position: relative; }
.canvas.dragover { background: #eaf1f9; outline: 2px dashed #285b9a; outline-offset: -6px; }
.canvas img { display: block; max-width: none; }
.empty { padding: 80px 20px; text-align: center; color: #777; line-height: 1.8; }
.status { margin: 0; padding: 8px 12px; border-top: 1px solid #ddd; min-height: 36px; overflow-wrap: anywhere; }
.legend { max-width: 1600px; margin: auto; font-size: 13px; }
@media (max-width: 800px) { .workspace { grid-template-columns: minmax(0, 1fr); } .canvas { height: 55vh; } }
</style>
</head>
<body>
<header>
<h1>asm2cfg 圖形比較</h1>
<p>把 CFG 或呼叫圖拖到左右兩側，檢查不同版本的差異。檔案只在此瀏覽器讀取，可離線使用。</p>
<label><input id="sync" type="checkbox" checked> 同步捲動</label>
</header>
<main class="workspace" id="workspace"></main>
<p class="legend">CFG：同色且標有 L1、L2 的區塊屬於同一迴圈區域；紅色粗箭頭標出回邊。啟用 --dominators 後，藍色表示直接支配關係；藍色點線僅表示支配關係。呼叫圖：虛線表示外部或未解析目標，標籤區分間接呼叫。</p>
<template id="panel-template">
<section class="panel">
<div class="toolbar">
<h2></h2>
<label class="file-label">選擇圖檔<input type="file" accept=".svg,.png,.jpg,.jpeg,.webp" multiple></label>
<select aria-label="目前圖檔"><option>尚未載入</option></select>
<label class="zoom">縮放<input type="range" min="20" max="300" value="100" step="10"><output>100%</output></label>
<button type="button">符合寬度</button>
</div>
<div class="canvas" tabindex="0" aria-label="圖形捲動區">
<div class="empty">拖放 SVG 或 PNG 圖檔到這裡<br>也可以按「選擇圖檔」</div>
<img hidden alt="">
</div>
<p class="status" role="status">尚未載入圖檔</p>
</section>
</template>
<script>
'use strict';
const panels = [];
let syncing = false;
const workspace = document.querySelector('#workspace');

function createPanel(title) {
    const panel = document.querySelector('#panel-template').content.firstElementChild.cloneNode(true);
    panel.querySelector('h2').textContent = title;
    const input = panel.querySelector('input[type=file]');
    const select = panel.querySelector('select');
    const canvas = panel.querySelector('.canvas');
    const image = panel.querySelector('img');
    const slider = panel.querySelector('input[type=range]');
    const output = panel.querySelector('output');
    const status = panel.querySelector('.status');
    const state = {canvas, urls: [], files: [], selected: null};

    function scale(value) {
        if (!image.naturalWidth) return;
        image.style.width = Math.round(image.naturalWidth * value / 100) + 'px';
        image.style.height = 'auto';
        slider.value = value;
        output.textContent = Math.round(value) + '%';
    }
    function show(index) {
        const file = state.files[index];
        if (!file) return;
        state.selected = file;
        image.hidden = true;
        status.textContent = '載入中：' + file.name;
        image.src = state.urls[index];
        image.alt = title + '：' + file.name;
        canvas.scrollTop = canvas.scrollLeft = 0;
    }
    image.addEventListener('load', () => {
        image.hidden = false;
        panel.querySelector('.empty').hidden = true;
        scale(Number(slider.value));
        status.textContent = state.selected.name + ' · ' +
            state.selected.size.toLocaleString() + ' bytes · ' + image.naturalWidth + ' × ' + image.naturalHeight;
    });
    image.addEventListener('error', () => {
        image.hidden = true;
        panel.querySelector('.empty').hidden = false;
        status.textContent = '無法開啟圖檔：' + (state.selected ? state.selected.name : '');
    });
    function load(files) {
        const accepted = Array.from(files).filter(file => /\.(svg|png|jpe?g|webp)$/i.test(file.name));
        if (!accepted.length) { status.textContent = '請選擇 SVG、PNG、JPEG 或 WebP 圖檔'; return; }
        state.urls.forEach(url => URL.revokeObjectURL(url));
        state.files = accepted;
        state.urls = accepted.map(file => URL.createObjectURL(file));
        select.replaceChildren();
        accepted.forEach((file, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = file.name;
            select.append(option);
        });
        show(0);
    }
    input.addEventListener('change', () => { load(input.files); input.value = ''; });
    select.addEventListener('change', () => show(Number(select.value)));
    slider.addEventListener('input', () => scale(Number(slider.value)));
    panel.querySelector('button').addEventListener('click', () => {
        if (image.naturalWidth) scale(Math.max(20, Math.min(300, (canvas.clientWidth - 32) / image.naturalWidth * 100)));
    });
    for (const event of ['dragover', 'dragleave', 'drop']) {
        canvas.addEventListener(event, e => {
            e.preventDefault();
            canvas.classList.toggle('dragover', event === 'dragover');
            if (event === 'drop') load(e.dataTransfer.files);
        });
    }
    canvas.addEventListener('scroll', () => {
        if (syncing || !document.querySelector('#sync').checked) return;
        syncing = true;
        const vertical = canvas.scrollTop / Math.max(1, canvas.scrollHeight - canvas.clientHeight);
        const horizontal = canvas.scrollLeft / Math.max(1, canvas.scrollWidth - canvas.clientWidth);
        for (const other of panels) {
            if (other === state) continue;
            other.canvas.scrollTop = vertical * (other.canvas.scrollHeight - other.canvas.clientHeight);
            other.canvas.scrollLeft = horizontal * (other.canvas.scrollWidth - other.canvas.clientWidth);
        }
        requestAnimationFrame(() => { syncing = false; });
    });
    panels.push(state);
    workspace.append(panel);
}
createPanel('左側版本');
createPanel('右側版本');
window.addEventListener('beforeunload', () => panels.forEach(panel => panel.urls.forEach(url => URL.revokeObjectURL(url))));
</script>
</body>
</html>
